name: KRCN Core quality

# Automatic runs are temporarily disabled to prevent Actions minute usage.
# Restore push and pull_request triggers when automatic CI is enabled again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify repository
        run: python tools/verify_repository.py
      - name: Run full tests
        run: python tools/run_tests.py
      - name: Run doctor
        run: python tools/krcn.py doctor
      - name: Verify offline wheel
        run: python tools/verify_wheel.py
      - name: Verify CLI installer plan
        run: python tools/install_cli.py --plan-only
      - name: Verify POSIX CLI installation
        if: runner.os != 'Windows'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/krcn-installer-home
          SHELL: /bin/sh
        run: |
          python tools/install_cli.py
          "$HOME/.local/share/krcn/cli/bin/krcn" context --validate-only

  coverage-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Measure dependency-free line coverage
        run: python tools/measure_coverage.py --minimum 60 --summary-only
