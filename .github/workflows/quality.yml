name: KRCN Core quality

# Automatic runs stay disabled while Actions minutes are held back. The gate
# structure below is ready: `fast-gate` is the intended required check and
# `cross-platform` is the release matrix. To enable automatic verification,
# restore the `push` and `pull_request` triggers below and remove the
# `cross-platform` job condition if the full matrix should also run per push.
#
#  push:
#    branches:
#      - main
#      - "mimari-**"
#  pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast Linux gate
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify repository
        run: python tools/verify_repository.py
      - name: Run full tests
        run: python tools/run_tests.py
      - name: Run doctor
        run: python tools/krcn.py doctor

  coverage-baseline:
    name: Coverage baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Measure dependency-free line coverage
        run: python tools/measure_coverage.py --minimum 60 --summary-only
      - name: Report measured commit
        run: python tools/verify_baseline_attestation.py --commit "${{ github.sha }}"

  cross-platform:
    name: Cross-platform matrix
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify repository
        run: python tools/verify_repository.py
      - name: Run full tests
        run: python tools/run_tests.py
      - name: Run doctor
        run: python tools/krcn.py doctor
      - name: Verify offline wheel
        run: python tools/verify_wheel.py
      - name: Verify CLI installer plan
        run: python tools/install_cli.py --plan-only
      - name: Verify POSIX CLI installation
        if: runner.os != 'Windows'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/krcn-installer-home
          SHELL: /bin/sh
        run: |
          python tools/install_cli.py
          "$HOME/.local/share/krcn/cli/bin/krcn" context --validate-only
